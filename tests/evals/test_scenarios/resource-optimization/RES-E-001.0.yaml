id: RES-E-001
chat-prompt: |
  Please optimize resources for the media-microservices service in media-microservices namespace.
  This is an unconstrained resource environment with no namespace quotas.
  Run performance benchmarks, collect metrics against targets (avg latency ≤100ms, p90 latency ≤200ms, success ≥99%), and recommend resource allocations.
  Send the optimization request to Kafka topic tests.normal as one JSON event payload.
  Include release name and namespace (media-microservices) in the payload.
  If workflow metadata is injected, use workflow_id as <WORKFLOW_ID> and include extra_instruction in the same JSON payload.
pre-condition-script: |
  # Pre-condition: Verify media-microservices namespace and services exist with no resource quotas.
  kubectl get ns media-microservices || kubectl create ns media-microservices
  kubectl get svc -n media-microservices --no-headers | wc -l
execution-script: |
  export CHAT_ENDPOINT=127.0.0.1:8002
  SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")

  echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  echo CHAT_PROMPT: ${CHAT_PROMPT}
  echo SESSION_ID: ${SESSION_ID}

  json_payload=$(jq -n \
  --arg message "$CHAT_PROMPT" \
  --arg session_id "$SESSION_ID" \
  '{message: $message, session_id: $session_id}')

  curl -X POST "${CHAT_ENDPOINT}/chat/send" \
    -H "Content-Type: application/json" \
    -d "$json_payload"
expected-execution-time: "600"
output-retrieval-script: |
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS}
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  # Cleanup: Remove any applied changes; preserve media-microservices namespace and running services
  true
