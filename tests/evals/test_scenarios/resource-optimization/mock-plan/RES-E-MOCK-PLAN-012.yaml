id: RES-E-MOCK-PLAN-012
chat-prompt: |
  Given the following environment scenarios.
  Scenarios:
  - Optimization target: release `checkout-api`, namespace `finance`.
  - Operating context: mixed workload pressure after node maintenance.
  - Edge case A: pod restarts occur during test execution due to transient dependency failures.
  - Edge case B: HPA-like external controller effect introduces replica churn during benchmarking.
  - Edge case C: namespace events contain heavy noise from unrelated jobs, obscuring restart/termination evidence.
  - Constraint 1: Plan must acquire CPU and memory metrics via resource-collector with a 1-minute step and tabular summary intent.
  - Constraint 2: Plan must identify high-impact services before applying any resource updates.
  - Constraint 3: Plan must define rollback/stop criteria when optimization worsens target compliance.
  - Additional realism: include fallback logic for transient failures, explicit safety checks before applying resource updates, and clear stop conditions when metrics degrade.
  - Additional realism: assume unstable signals (event noise, delayed readiness, partial failures) and require a conservative, auditable optimization plan.

  **IMPORTANT** Do not execute any tools.
  Instead, provide a recommended plan to safely optimize resiliency and performance for checkout-api in namespace finance.

pre-condition-script: |

execution-script: |
  python3 tools/mock_plan_resiliency_kafka_test_runner.py
expected-execution-time: "600"
output-retrieval-script: |
  PERSONA=resiliency-optimizer
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} ${PERSONA}
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  true
