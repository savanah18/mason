id: RES-E-MOCK-PLAN-010
chat-prompt: |
  Given the following environment scenarios.
  Scenarios:
  - Optimization target: release `notification-engine`, namespace `media-microservices`.
  - Operating context: normal load profile with strict SLO enforcement.
  - Edge case A: a noisy neighbor workload in the same namespace distorts baseline performance metrics.
  - Edge case B: daemonset pressure on nodes causes scheduling contention for latency-sensitive pods.
  - Edge case C: resource-collector CPU query returns sparse datapoints for some pods because of short-lived restarts.
  - Constraint 1: Plan must produce auditable output with timestamps, decisions, and workflow traceability.
  - Constraint 2: Plan must include namespace event review focused on restarted/terminated signals during test window.
  - Constraint 3: Plan must gate kubernetes-apply-resource-update on container-level verification and impact rationale.
  - Additional realism: include fallback logic for transient failures, explicit safety checks before applying resource updates, and clear stop conditions when metrics degrade.
  - Additional realism: assume unstable signals (event noise, delayed readiness, partial failures) and require a conservative, auditable optimization plan.

  **IMPORTANT** Do not execute any tools.
  Instead, provide a recommended plan to safely optimize resiliency and performance for notification-engine in namespace media-microservices.

