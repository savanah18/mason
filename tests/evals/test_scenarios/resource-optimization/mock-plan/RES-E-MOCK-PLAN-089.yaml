id: RES-E-MOCK-PLAN-089
chat-prompt: |
  Given the following environment scenarios.
  Scenarios:
  - Optimization target: release `inventory-api`, namespace `retail`.
  - Operating context: quota-constrained namespace during peak traffic.
  - Edge case A: top pods by CPU differ between 1m and 5m windows, creating ranking ambiguity for high-impact services.
  - Edge case B: recent manual resource patch drifted from Helm-managed intent and needs cautious reconciliation.
  - Edge case C: helm-test intermittently times out due to delayed service warm-up under load.
  - Constraint 1: Plan must define rollback/stop criteria when optimization worsens target compliance.
  - Constraint 2: Plan must include namespace quota retrieval before final optimization recommendations.
  - Constraint 3: Plan must identify high-impact services before applying any resource updates.
  - Additional realism: include fallback logic for transient failures, explicit safety checks before applying resource updates, and clear stop conditions when metrics degrade.
  - Additional realism: assume unstable signals (event noise, delayed readiness, partial failures) and require a conservative, auditable optimization plan.

  **IMPORTANT** Do not execute any tools.
  Instead, provide a recommended plan to safely optimize resiliency and performance for inventory-api in namespace retail.

