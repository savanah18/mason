id: RES-E-MOCK-PLAN-023
chat-prompt: |
  Given the following environment scenarios.
  Scenarios:
  - Optimization target: release `billing-worker`, namespace `edge`.
  - Operating context: accelerated load profile during failover rehearsal.
  - Edge case A: resource-collector memory series contains spikes from sidecar bursts that can mislead peak estimation.
  - Edge case B: top pods by CPU differ between 1m and 5m windows, creating ranking ambiguity for high-impact services.
  - Edge case C: recent manual resource patch drifted from Helm-managed intent and needs cautious reconciliation.
  - Constraint 1: Plan must include namespace quota retrieval before final optimization recommendations.
  - Constraint 2: Plan must gate kubernetes-apply-resource-update on container-level verification and impact rationale.
  - Constraint 3: Plan must produce auditable output with timestamps, decisions, and workflow traceability.
  - Additional realism: include fallback logic for transient failures, explicit safety checks before applying resource updates, and clear stop conditions when metrics degrade.
  - Additional realism: assume unstable signals (event noise, delayed readiness, partial failures) and require a conservative, auditable optimization plan.

  **IMPORTANT** Do not execute any tools.
  Instead, provide a recommended plan to safely optimize resiliency and performance for billing-worker in namespace edge.

pre-condition-script: |

execution-script: |
  python3 tools/mock_plan_resiliency_kafka_test_runner.py
expected-execution-time: "600"
