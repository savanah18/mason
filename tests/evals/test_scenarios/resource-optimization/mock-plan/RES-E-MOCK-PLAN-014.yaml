id: RES-E-MOCK-PLAN-014
chat-prompt: |
  Given the following environment scenarios.
  Scenarios:
  - Optimization target: release `fraud-detector`, namespace `staging`.
  - Operating context: post-incident stabilization with noisy signals.
  - Edge case A: p90 latency improves while average latency regresses, creating target trade-off tension.
  - Edge case B: clock skew causes event ordering ambiguity between test start and restart observations.
  - Edge case C: resource quotas are near hard limits, making naive replica scaling fail with admission errors.
  - Constraint 1: Plan must include namespace event review focused on restarted/terminated signals during test window.
  - Constraint 2: Plan must include conservative retry logic (up to 3) for transient tool failures.
  - Constraint 3: Plan must include explicit helm-test execution strategy and 5-minute timeout handling.
  - Additional realism: include fallback logic for transient failures, explicit safety checks before applying resource updates, and clear stop conditions when metrics degrade.
  - Additional realism: assume unstable signals (event noise, delayed readiness, partial failures) and require a conservative, auditable optimization plan.

  **IMPORTANT** Do not execute any tools.
  Instead, provide a recommended plan to safely optimize resiliency and performance for fraud-detector in namespace staging.

