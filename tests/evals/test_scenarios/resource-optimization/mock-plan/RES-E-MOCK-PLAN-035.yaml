id: RES-E-MOCK-PLAN-035
chat-prompt: |
  Given the following environment scenarios.
  Scenarios:
  - Optimization target: release `recommendation-api`, namespace `sandbox`.
  - Operating context: high-latency upstream dependency simulation.
  - Edge case A: recent manual resource patch drifted from Helm-managed intent and needs cautious reconciliation.
  - Edge case B: helm-test intermittently times out due to delayed service warm-up under load.
  - Edge case C: one critical deployment shows desired replicas met but readiness lags due to probe instability.
  - Constraint 1: Plan must evaluate targets: avg latency <=100ms, p90 <=200ms, success ratio >=99%.
  - Constraint 2: Plan must define rollback/stop criteria when optimization worsens target compliance.
  - Constraint 3: Plan must acquire CPU and memory metrics via resource-collector with a 1-minute step and tabular summary intent.
  - Additional realism: include fallback logic for transient failures, explicit safety checks before applying resource updates, and clear stop conditions when metrics degrade.
  - Additional realism: assume unstable signals (event noise, delayed readiness, partial failures) and require a conservative, auditable optimization plan.

  **IMPORTANT** Do not execute any tools.
  Instead, provide a recommended plan to safely optimize resiliency and performance for recommendation-api in namespace sandbox.

pre-condition-script: |

execution-script: |
  python3 tools/mock_plan_resiliency_kafka_test_runner.py
expected-execution-time: "1200"
output-retrieval-script: |
  PERSONA=resiliency-optimizer
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} ${PERSONA}
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  true
