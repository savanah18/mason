id: RES-E-MOCK-PLAN-098
chat-prompt: |
  Given the following environment scenarios.
  Scenarios:
  - Optimization target: release `edge-gateway`, namespace `perf-lab`.
  - Operating context: resource-fragmented cluster under bin-packing stress.
  - Edge case A: HPA-like external controller effect introduces replica churn during benchmarking.
  - Edge case B: namespace events contain heavy noise from unrelated jobs, obscuring restart/termination evidence.
  - Edge case C: a noisy neighbor workload in the same namespace distorts baseline performance metrics.
  - Constraint 1: Plan must include conservative retry logic (up to 3) for transient tool failures.
  - Constraint 2: Plan must acquire CPU and memory metrics via resource-collector with a 1-minute step and tabular summary intent.
  - Constraint 3: Plan must evaluate targets: avg latency <=100ms, p90 <=200ms, success ratio >=99%.
  - Additional realism: include fallback logic for transient failures, explicit safety checks before applying resource updates, and clear stop conditions when metrics degrade.
  - Additional realism: assume unstable signals (event noise, delayed readiness, partial failures) and require a conservative, auditable optimization plan.

  **IMPORTANT** Do not execute any tools.
  Instead, provide a recommended plan to safely optimize resiliency and performance for edge-gateway in namespace perf-lab.

pre-condition-script: |

execution-script: |
  python3 tools/mock_plan_resiliency_kafka_test_runner.py
expected-execution-time: "1200"
output-retrieval-script: |
  PERSONA=resiliency-optimizer
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} ${PERSONA}
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  true
