id: RES-E-004.0
chat-prompt: |
  TODO/PLACEHOLDER: Chaos scenario (pod-delete) for media-microservices in media-microservices namespace.
  TODO/PLACEHOLDER: Run resiliency resource optimization after Litmus chaos injection is triggered.
  TODO/PLACEHOLDER: Send optimization request to Kafka topic tests.normal as one JSON event payload.
  Include release name and namespace (media-microservices) in the payload.
  If workflow metadata is injected, use workflow_id as <WORKFLOW_ID> and include extra_instruction in the same JSON payload.
pre-condition-script: |
  # TODO/PLACEHOLDER: Verify namespace exists before chaos setup.
  kubectl get ns media-microservices || kubectl create ns media-microservices

  # TODO/PLACEHOLDER: Call litmus-chaos event for pod-delete fault injection.
  # Example placeholder only; replace with actual MCP/Litmus invocation when integrated.
  echo "TODO/PLACEHOLDER: invoke litmus-chaos event type=pod-delete namespace=media-microservices target=compose-review-service"
execution-script: |
  export CHAT_ENDPOINT=127.0.0.1:8002
  SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")

  echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  echo CHAT_PROMPT: ${CHAT_PROMPT}
  echo SESSION_ID: ${SESSION_ID}

  json_payload=$(jq -n \
  --arg message "$CHAT_PROMPT" \
  --arg session_id "$SESSION_ID" \
  '{message: $message, session_id: $session_id}')

  curl -X POST "${CHAT_ENDPOINT}/chat/send" \
    -H "Content-Type: application/json" \
    -d "$json_payload"
expected-execution-time: "600"
output-retrieval-script: |
  PERSONA=resiliency-optimizer
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} ${PERSONA}
evaluation-script:
  echo TODO/PLACEHOLDER evaluation script with LLM as a judge
post-condition-script: |
  # TODO/PLACEHOLDER: Cleanup litmus-chaos experiment resources after integration.
  true
