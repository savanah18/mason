id: RES-E-003.3
chat-prompt: |
  Please optimize resources for the media-microservices service in media-microservices namespace.
  This scenario starts from a high-throughput profile derived from service call traces in the architecture flow.
  Run performance benchmarks, collect metrics against targets (avg latency ≤100ms, p90 latency ≤200ms, success ≥99%), and recommend resource allocations.
  Send the optimization request to Kafka topic tests.normal as one JSON event payload.
  Include release name and namespace (media-microservices) in the payload.
  If workflow metadata is injected, use workflow_id as <WORKFLOW_ID> and include extra_instruction in the same JSON payload.
pre-condition-script: |
  # Pre-condition: Apply trace-based high-throughput profile to all deployments.
  NS=media-microservices
  kubectl get ns ${NS} || kubectl create ns ${NS}

  # Baseline for all deployments.
  for d in $(kubectl get deploy -n ${NS} -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
    kubectl scale deploy "$d" -n ${NS} --replicas=1 || true
    kubectl set resources deploy "$d" -n ${NS} --all-containers \
      --requests=cpu=300m,memory=200Mi --limits=cpu=300m,memory=200Mi || true
  done

  # Tier-1 hot path from trace graph: scale to 3 and highest pod resources.
  for d in nginx-web-server compose-review-service review-storage-service movie-review-service user-review-service; do
    kubectl scale deploy "$d" -n ${NS} --replicas=3 || true
    kubectl set resources deploy "$d" -n ${NS} --all-containers \
      --requests=cpu=1,memory=1Gi --limits=cpu=1,memory=1Gi || true
  done

  # Tier-2 API path services.
  for d in movie-id-service rating-service text-service user-service page-service; do
    kubectl scale deploy "$d" -n ${NS} --replicas=2 || true
    kubectl set resources deploy "$d" -n ${NS} --all-containers \
      --requests=cpu=800m,memory=700Mi --limits=cpu=800m,memory=700Mi || true
  done

  # Supporting services.
  for d in cast-info-service movie-info-service plot-service unique-id-service jaeger; do
    kubectl scale deploy "$d" -n ${NS} --replicas=2 || true
    kubectl set resources deploy "$d" -n ${NS} --all-containers \
      --requests=cpu=500m,memory=400Mi --limits=cpu=500m,memory=400Mi || true
  done

  # Stateful backends: singleton with high memory and cpu within requested bounds.
  for d in $(kubectl get deploy -n ${NS} -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep -E 'mongodb|redis|memcached'); do
    kubectl scale deploy "$d" -n ${NS} --replicas=1 || true
    kubectl set resources deploy "$d" -n ${NS} --all-containers \
      --requests=cpu=900m,memory=1Gi --limits=cpu=900m,memory=1Gi || true
  done
