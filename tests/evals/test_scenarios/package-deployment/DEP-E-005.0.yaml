id: DEP-E-005.0
chat-prompt: |
  Please process an update for cache-layer in namespace infra using chart bitnami/memcached version 7.2.1.
  You may choose a speed-prioritized or stability-prioritized upgrade path depending on observed runtime state.
  Send the request as one Kafka event payload in JSON.
  Include the core fields from the request, and include workflow metadata if present.
  If workflow metadata is injected, use workflow_id as <WORKFLOW_ID> and include extra_instruction in the same JSON payload.
expected-event-input: |
  Your task is to ALWAYS execute the requested action, even if it looks similar to a previous request.
  Do not assume prior execution is sufficient.
  Current workflow ID: <WORKFLOW_ID>
  Percepts: [{"event_type":"update","release_name":"cache-layer","chart":"bitnami/memcached","version":"7.2.1","namespace":"infra"}]
  Action: Process requests using your defined workflow.
pre-condition-script: |
  # Pre-condition: existing release requires quick version bump.
  helm repo add bitnami https://charts.bitnami.com/bitnami || true
  helm repo update
  kubectl create ns infra --dry-run=client -o yaml | kubectl apply -f -
  helm uninstall cache-layer -n infra || true
  helm install cache-layer bitnami/memcached --version 7.1.9 -n infra
execution-script: |
  export CHAT_ENDPOINT=127.0.0.1:8002
  SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")

  echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  echo CHAT_PROMPT: ${CHAT_PROMPT}
  echo SESSION_ID: ${SESSION_ID}

  json_payload=$(jq -n \
  --arg message "$CHAT_PROMPT" \
  --arg session_id "$SESSION_ID" \
  '{message: $message, session_id: $session_id}')

  curl -X POST "${CHAT_ENDPOINT}/chat/send" \
    -H "Content-Type: application/json" \
    -d "$json_payload"
expected-execution-time: "120"
output-retrieval-script: |
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS}
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  helm uninstall cache-layer -n infra || true
  kubectl delete ns infra --ignore-not-found=true
