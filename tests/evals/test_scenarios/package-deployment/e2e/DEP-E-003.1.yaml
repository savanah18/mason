id: DEP-E-003.1
chat-prompt: |
  Please process a publish request for search-api in namespace search using chart bitnamicharts/postgresql version 18.5.14.
  Use OCI registry chart reference 'oci://registry-1.docker.io/bitnamicharts/postgresql' .
  Custom values may already exist, so you may choose either values-diff checking or history-based confirmation before deciding no-op.

pre-condition-script: |
  # Pre-condition: same target version exists with persisted values already set.
  echo "Skipping helm repo add: using OCI charts"
  echo "Skipping helm repo update: using OCI charts"
  kubectl create ns search --dry-run=client -o yaml | kubectl apply -f -
  helm uninstall search-api -n search || true
  helm install search-api 'oci://registry-1.docker.io/bitnamicharts/postgresql' --version 18.5.14 -n search --set auth.username=searcher  --set global.storageClass=nfs-client
