id: DEP-F-006.0
chat-prompt: |
  Please process a publish request for event-cache in namespace events.
  Use nfs-client as storage class.
  Use OCI registry chart reference oci://registry-1.docker.io/bitnamicharts/redis version 25.3.9.
  Send the request as a Kafka event payload in JSON, correct any malformed payload fields, and retry safely.
  If workflow metadata is injected, include workflow_id as <WORKFLOW_ID> and pass extra_instruction in the same payload.

pre-condition-script: |
  kubectl create ns events --dry-run=client -o yaml | kubectl apply -f -
  helm uninstall event-cache -n events || true
  kubectl create configmap events-routing -n events --from-literal=topic=deploy.requests --dry-run=client -o yaml | kubectl apply -f -
execution-script: |
  python3 tools/mock_plan_kafka_test_runner.py
expected-execution-time: "900"
output-retrieval-script: |
  PERSONA=deployer
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} ${PERSONA}
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  helm uninstall event-cache -n events || true
  kubectl delete configmap events-routing -n events --ignore-not-found=true || true
  kubectl delete ns events --ignore-not-found=true
