id: DEP-E-005.0
chat-prompt: |
  Please process an update for cache-layer in namespace infra using chart bitnamicharts/memcached version 8.3.7.
  Use OCI registry chart reference oci://registry-1.docker.io/bitnamicharts/memcached .
  You may choose a speed-prioritized or stability-prioritized upgrade path depending on observed runtime state.

pre-condition-script: |
  # Pre-condition: existing release requires quick version bump.
  echo "Skipping helm repo add: using OCI charts"
  echo "Skipping helm repo update: using OCI charts"
  kubectl create ns infra --dry-run=client -o yaml | kubectl apply -f -
  helm uninstall cache-layer -n infra || true
  helm install cache-layer oci://registry-1.docker.io/bitnamicharts/memcached --version 8.3.7 -n infra
