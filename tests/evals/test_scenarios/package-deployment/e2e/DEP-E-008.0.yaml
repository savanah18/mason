id: DEP-E-008.0
chat-prompt: |
  Please process a deploy request for media-api in namespace media.
  Use OCI registry chart reference oci://registry-1.docker.io/bitnamicharts/nginx version 22.6.10.
  Context: mixed workload pressure with noisy events and service account/RBAC instability.
  Scenarios:
  - Deployment target: release `media-api`, namespace `media`, chart `oci://registry-1.docker.io/bitnamicharts/nginx`, requested version `22.6.10`.
  - Operating context: mixed workload pressure with noisy events and service account/RBAC instability.
  - Edge case A: Namespace events include unrelated restart noise and unrelated batch jobs.
  - Edge case B: ServiceAccount permissions changed recently and could affect post-deploy checks.
  - Edge case C: Mutating webhooks may inject extra containers that change resource footprint.
  - Constraint 1: Focus on release-specific signals and ignore unrelated event noise.
  - Constraint 2: Double-check workload/container state after rollout.
  - Constraint 3: Recommend only safe resource or replica changes that fit observed capacity.
  - Additional realism: include fallback logic for transient failures, explicit safety checks before rollout, and rollback criteria if health signals degrade.
  - Additional realism: assume unstable environment signals (event noise, delayed readiness, partial failures) and require a conservative, auditable deployment plan.

  Execute the deployment safely using the tools available to you.
  Prioritize validation, safe rollout sequencing, and rollback readiness for media-api from oci://registry-1.docker.io/bitnamicharts/nginx version 22.6.10.




pre-condition-script: |
  kubectl create ns media --dry-run=client -o yaml | kubectl apply -f -
  helm uninstall media-api -n media || true
  kubectl delete resourcequota -n media --ignore-not-found=true
  helm install media-api oci://registry-1.docker.io/bitnamicharts/nginx --version 22.6.10 -n media --create-namespace
execution-script: |
  # Legacy chat transport path disabled for direct agent testing:
  # export CHAT_ENDPOINT=127.0.0.1:8002
  # SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")
  #
  # echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  # echo CHAT_PROMPT: ${CHAT_PROMPT}
  # echo SESSION_ID: ${SESSION_ID}
  #
  # json_payload=$(jq -n   --arg message "$CHAT_PROMPT"   --arg session_id "$SESSION_ID"   '{message: $message, session_id: $session_id}')
  #
  # curl -X POST "${CHAT_ENDPOINT}/chat/send"     -H "Content-Type: application/json"     -d "$json_payload"
  python3 tools/mock_plan_kafka_test_runner.py
expected-execution-time: "900"
output-retrieval-script: |
  PERSONA=deployer
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} ${PERSONA}
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  if kubectl get ns media >/dev/null 2>&1; then
    helm uninstall media-api -n media || true
    helm uninstall media-cache -n media || true
    kubectl delete resourcequota media-tight-quota -n media --ignore-not-found=true || true
    kubectl delete resourcequota media-policy-block -n media --ignore-not-found=true || true
    kubectl delete limitrange media-default-limits -n media --ignore-not-found=true || true
    kubectl delete configmap media-manual-config -n media --ignore-not-found=true || true
    kubectl annotate namespace media pod-security.kubernetes.io/enforce- --overwrite || true
  fi
  kubectl delete ns media --ignore-not-found=true
  kubectl wait --for=delete namespace/media --timeout=120s || true
