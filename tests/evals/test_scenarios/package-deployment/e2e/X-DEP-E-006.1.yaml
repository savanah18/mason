id: X-DEP-E-006.1
chat-prompt: |
  Please process a deploy request for media-api in namespace media.
  Use OCI registry chart reference oci://registry-1.docker.io/bitnamicharts/nginx version 22.6.10.
  Context: an older release is already present and must be upgraded without a destructive reinstall.
  Scenarios:
  - Deployment target: release `media-api`, namespace `media`, chart `oci://registry-1.docker.io/bitnamicharts/nginx`, requested version `22.6.10`.
  - Operating context: an older release is already present and must be upgraded without a destructive reinstall.
  - Edge case A: A previous version of the same release is already installed.
  - Edge case B: Release history exists and indicates an upgrade path rather than a fresh install.
  - Edge case C: A prior manual change may have drifted values from chart defaults.
  - Constraint 1: Check release history before deciding between install and upgrade.
  - Constraint 2: Avoid unnecessary uninstall/reinstall if an upgrade is safer.
  - Constraint 3: Verify the final release version after the action completes.
  - Additional realism: include fallback logic for transient failures, explicit safety checks before rollout, and rollback criteria if health signals degrade.
  - Additional realism: assume unstable environment signals (event noise, delayed readiness, partial failures) and require a conservative, auditable deployment plan.

  Execute the deployment safely using the tools available to you.
  Prioritize validation, safe rollout sequencing, and rollback readiness for media-api from oci://registry-1.docker.io/bitnamicharts/nginx version 22.6.10.

pre-condition-script: |
  kubectl create ns media --dry-run=client -o yaml | kubectl apply -f -
  helm uninstall media-api -n media || true
  helm install media-api oci://registry-1.docker.io/bitnamicharts/nginx --version 22.6.9 -n media --create-namespace
execution-script: |
  export CHAT_ENDPOINT=127.0.0.1:8002
  SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")

  echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  echo CHAT_PROMPT: ${CHAT_PROMPT}
  echo SESSION_ID: ${SESSION_ID}

  json_payload=$(jq -n   --arg message "$CHAT_PROMPT"   --arg session_id "$SESSION_ID"   '{message: $message, session_id: $session_id}')

  curl -X POST "${CHAT_ENDPOINT}/chat/send"     -H "Content-Type: application/json"     -d "$json_payload"
expected-execution-time: "600"
output-retrieval-script: |
  PERSONA=deployer
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} ${PERSONA}
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  helm uninstall media-api -n media || true
  kubectl delete ns media --ignore-not-found=true
