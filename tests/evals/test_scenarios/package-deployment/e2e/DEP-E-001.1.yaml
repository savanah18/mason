id: DEP-E-001.1
chat-prompt: |
  Please process a fresh install for media-api in namespace media.
  Strictly use OCI registry chart reference oci://registry-1.docker.io/bitnamicharts/nginx version 22.6.10.
  If release state is unclear, you may choose list-first or template-first validation based on available tools.

pre-condition-script: |
  # New pre-condition
  echo "Skipping helm repo add: using OCI charts"
  helm uninstall media-api -n media || true
  helm install media-api oci://registry-1.docker.io/bitnamicharts/nginx --version 22.6.10 --namespace media --create-namespace
