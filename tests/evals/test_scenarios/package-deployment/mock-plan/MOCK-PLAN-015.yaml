id: MOCK-PLAN-015
chat-prompt: |
  Given the following environment scenarios.
  Scenarios:
  - Deployment target: release `reporting-ui`, namespace `ops`, chart `oci://registry-1.docker.io/bitnamicharts/nginx`, requested version `22.6.10`.
  - Operating context: security hardening rollout with policy churn.
  - Edge case A: Cluster clock skew observed across nodes; event timestamps may appear out of order during triage.
  - Edge case B: Registry intermittently returns 401 for helm-registry-login; credentials may rotate during deployment window.
  - Edge case C: Helm test hooks are flaky due to dependent service warm-up delays and transient DNS issues.
  - Constraint 1: Resource updates may be needed using kubernetes-apply-resource-update when limits/requests are missing.
  - Constraint 2: If release name is already in use, plan should compare upgrade vs uninstall/reinstall trade-offs.
  - Constraint 3: Validation should include helm-template and helm-lint outcomes under noisy but recoverable warning conditions.
  - Additional realism: include fallback logic for transient failures, explicit safety checks before rollout, and rollback criteria if health signals degrade.
  - Additional realism: assume unstable environment signals (event noise, delayed readiness, partial failures) and require a conservative, auditable deployment plan.

  **IMPORTANT** Do not execute any tools.
  Instead, provide a recommended plan to safely deploy reporting-ui from oci://registry-1.docker.io/bitnamicharts/nginx version 22.6.10.


