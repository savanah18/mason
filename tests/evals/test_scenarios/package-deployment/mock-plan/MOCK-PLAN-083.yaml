id: MOCK-PLAN-083
chat-prompt: |
  Given the following environment scenarios.
  Scenarios:
  - Deployment target: release `inventory-api`, namespace `sandbox`, chart `oci://registry-1.docker.io/bitnamicharts/nginx`, requested version `22.6.10`.
  - Operating context: overnight maintenance window with reduced staff.
  - Edge case A: Namespace exists but has strict ResourceQuota nearing hard limits for cpu/memory requests.
  - Edge case B: PVC provisioning is delayed because storage class backend is degraded intermittently.
  - Edge case C: Cluster clock skew observed across nodes; event timestamps may appear out of order during triage.
  - Constraint 1: Post-install verification should consider kubernetes-list-workloads readiness mismatches and delayed rollouts.
  - Constraint 2: If tests fail, plan should include deterministic triage before deciding rollback or retry.
  - Constraint 3: If quotas are tight, plan should stage values overrides that reduce requests before retrying deployment.
  - Additional realism: include fallback logic for transient failures, explicit safety checks before rollout, and rollback criteria if health signals degrade.
  - Additional realism: assume unstable environment signals (event noise, delayed readiness, partial failures) and require a conservative, auditable deployment plan.

  **IMPORTANT** Do not execute any tools.
  Instead, provide a recommended plan to safely deploy inventory-api from oci://registry-1.docker.io/bitnamicharts/nginx version 22.6.10.


pre-condition-script: |

