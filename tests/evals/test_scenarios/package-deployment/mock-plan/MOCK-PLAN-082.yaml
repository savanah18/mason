id: MOCK-PLAN-082
chat-prompt: |
  Given the following environment scenarios.
  Scenarios:
  - Deployment target: release `billing-worker`, namespace `staging`, chart `oci://registry-1.docker.io/bitnamicharts/redis`, requested version `21.2.4`.
  - Operating context: cost-optimization sprint with constrained compute.
  - Edge case A: Chart pull occasionally fails with 429 rate limiting from OCI registry and requires careful retry/backoff planning.
  - Edge case B: Pods schedule slowly due to node pressure and uneven taints across worker pools.
  - Edge case C: A previous manual hotfix changed release values directly, causing config drift from desired chart defaults.
  - Constraint 1: Validation should include helm-template and helm-lint outcomes under noisy but recoverable warning conditions.
  - Constraint 2: Rollback path should reference helm-get-history and choose safest known-good revision with justification.
  - Constraint 3: If release name is already in use, plan should compare upgrade vs uninstall/reinstall trade-offs.
  - Additional realism: include fallback logic for transient failures, explicit safety checks before rollout, and rollback criteria if health signals degrade.
  - Additional realism: assume unstable environment signals (event noise, delayed readiness, partial failures) and require a conservative, auditable deployment plan.

  **IMPORTANT** Do not execute any tools.
  Instead, provide a recommended plan to safely deploy billing-worker from oci://registry-1.docker.io/bitnamicharts/redis version 21.2.4.


