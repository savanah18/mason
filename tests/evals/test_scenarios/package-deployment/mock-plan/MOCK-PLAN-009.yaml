id: MOCK-PLAN-009
chat-prompt: |
  Given the following environment scenarios.
  Scenarios:
  - Deployment target: release `recommendation-api`, namespace `prod-like`, chart `oci://registry-1.docker.io/bitnamicharts/nginx`, requested version `22.6.10`.
  - Operating context: compliance audit week with strict change controls.
  - Edge case A: PVC provisioning is delayed because storage class backend is degraded intermittently.
  - Edge case B: Cluster clock skew observed across nodes; event timestamps may appear out of order during triage.
  - Edge case C: Registry intermittently returns 401 for helm-registry-login; credentials may rotate during deployment window.
  - Constraint 1: If release name is already in use, plan should compare upgrade vs uninstall/reinstall trade-offs.
  - Constraint 2: Post-install verification should consider kubernetes-list-workloads readiness mismatches and delayed rollouts.
  - Constraint 3: Rollback path should reference helm-get-history and choose safest known-good revision with justification.
  - Additional realism: include fallback logic for transient failures, explicit safety checks before rollout, and rollback criteria if health signals degrade.
  - Additional realism: assume unstable environment signals (event noise, delayed readiness, partial failures) and require a conservative, auditable deployment plan.

  **IMPORTANT** Do not execute any tools.
  Instead, provide a recommended plan to safely deploy recommendation-api from oci://registry-1.docker.io/bitnamicharts/nginx version 22.6.10.


pre-condition-script: |

