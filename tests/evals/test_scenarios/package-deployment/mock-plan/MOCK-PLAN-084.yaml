id: MOCK-PLAN-084
chat-prompt: |
  Given the following environment scenarios.
  Scenarios:
  - Deployment target: release `payments-gateway`, namespace `retail`, chart `oci://ghcr.io/acme/charts/payments`, requested version `3.4.1`.
  - Operating context: incident recovery period with elevated alert noise.
  - Edge case A: Namespace is missing and must be created implicitly; admission webhooks are slow and can time out.
  - Edge case B: NetworkPolicy defaults deny egress; registry and dependency endpoints may be unreachable after install.
  - Edge case C: Canary namespace mirrors production policies but has stale secrets and outdated configmaps.
  - Constraint 1: Namespace events may include unrelated noise; plan should isolate release-specific failure signals.
  - Constraint 2: When login fails but chart is public, plan should evaluate whether direct pull may still succeed safely.
  - Constraint 3: Pre-check must account for existing releases via helm-list-releases before install/upgrade decisions.
  - Additional realism: include fallback logic for transient failures, explicit safety checks before rollout, and rollback criteria if health signals degrade.
  - Additional realism: assume unstable environment signals (event noise, delayed readiness, partial failures) and require a conservative, auditable deployment plan.

  **IMPORTANT** Do not execute any tools.
  Instead, provide a recommended plan to safely deploy payments-gateway from oci://ghcr.io/acme/charts/payments version 3.4.1.


pre-condition-script: |

execution-script: |
  python3 tools/mock_plan_kafka_test_runner.py
expected-execution-time: "600"
output-retrieval-script: |
  PERSONA=deployer
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} ${PERSONA}
