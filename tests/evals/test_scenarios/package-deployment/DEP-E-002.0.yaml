id: DEP-E-002.0
chat-prompt: |
  Please process an update for billing-worker in namespace finance using chart bitnami/redis version 25.3.9.
  Use OCI registry chart reference oci://registry-1.docker.io/bitnamicharts/redis instead of Helm repo URLs.
  You may choose either a history-aware or direct validation path before updating, whichever is safer from observed state.
  Send the request as one Kafka event payload in JSON.
  Include the core fields from the request, and include workflow metadata if present.
  If workflow metadata is injected, use workflow_id as <WORKFLOW_ID> and include extra_instruction in the same JSON payload.
pre-condition-script: |
  # Pre-condition: release exists at previous version and should be upgraded.
  echo "Skipping helm repo add: using OCI charts"
  kubectl create ns finance --dry-run=client -o yaml | kubectl apply -f -
  helm uninstall billing-worker -n finance || true
  helm install billing-worker oci://registry-1.docker.io/bitnamicharts/redis --version 25.3.8 --set global.storageClass=nfs-client -n finance
execution-script: |
  export CHAT_ENDPOINT=127.0.0.1:8002
  SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")

  echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  echo CHAT_PROMPT: ${CHAT_PROMPT}
  echo SESSION_ID: ${SESSION_ID}

  json_payload=$(jq -n \
  --arg message "$CHAT_PROMPT" \
  --arg session_id "$SESSION_ID" \
  '{message: $message, session_id: $session_id}')

  curl -X POST "${CHAT_ENDPOINT}/chat/send" \
    -H "Content-Type: application/json" \
    -d "$json_payload"
expected-execution-time: "600"
output-retrieval-script: |
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS}
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  helm uninstall billing-worker -n finance || true
  kubectl delete ns finance --ignore-not-found=true
