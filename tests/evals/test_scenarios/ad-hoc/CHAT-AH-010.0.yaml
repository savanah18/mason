id: CHAT-AH-010.0
chat-prompt: |
  Ad-hoc request: produce a compact workload and resource overview for namespace finance.
  Use kubernetes-list-workloads first, then resource-collector for finance namespace.
  Keep metrics acquisition simple: one namespace, one snapshot, one short summary.
  Return only the top workloads by requested CPU and memory plus any notable namespace settings.
  Constraint: use up to 2 related tool calls.
  If workflow metadata is injected, use workflow_id as <WORKFLOW_ID>
pre-condition-script: |
  # Pre-condition: finance namespace should exist.
  kubectl get ns finance || kubectl create ns finance
  kubectl get deploy -n finance --no-headers | wc -l
execution-script: |
  export CHAT_ENDPOINT=127.0.0.1:8002
  SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")

  echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  echo CHAT_PROMPT: ${CHAT_PROMPT}
  echo SESSION_ID: ${SESSION_ID}

  json_payload=$(jq -n \
  --arg message "$CHAT_PROMPT" \
  --arg session_id "$SESSION_ID" \
  --arg workflow_id "$WORKFLOW_ID" \
  '{message: $message, session_id: $session_id, workflow_id: $workflow_id}')

  curl -X POST "${CHAT_ENDPOINT}/chat/send" \
    -H "Content-Type: application/json" \
    -d "$json_payload"
expected-execution-time: "600"
output-retrieval-script: |
  PERSONA=chat
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} $PERSONA
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  # Read-only workload and resource introspection.
  true
