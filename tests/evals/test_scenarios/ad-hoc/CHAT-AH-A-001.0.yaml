id: CHAT-AH-A-001.0
chat-prompt: |
  Ad-hoc request: diagnose a deployment scaling issue in namespace dev-apps.
  Use workload inspection to identify which deployment has mismatched desired vs actual replicas.
  Explain the likely cause and recommend a next step for remediation.
  If workflow metadata is injected, use workflow_id as <WORKFLOW_ID>
pre-condition-script: |
  # Pre-condition: namespace with mismatched replica target
  kubectl delete ns dev-apps --ignore-not-found=true || true
  kubectl wait --for=delete namespace/dev-apps --timeout=120s || true
  kubectl create ns dev-apps
  kubectl apply -f - <<EOF
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: api-service
    namespace: dev-apps
  spec:
    replicas: 3
    selector:
      matchLabels:
        app: api-service
    template:
      metadata:
        labels:
          app: api-service
      spec:
        containers:
        - name: api
          image: nginx:1.27
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
  EOF
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: ResourceQuota
  metadata:
    name: dev-tight
    namespace: dev-apps
  spec:
    hard:
      requests.cpu: "200m"
      requests.memory: "256Mi"
  EOF
  sleep 2
execution-script: |
  export CHAT_ENDPOINT=127.0.0.1:8002
  SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")

  echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  echo CHAT_PROMPT: ${CHAT_PROMPT}
  echo SESSION_ID: ${SESSION_ID}

  json_payload=$(jq -n \
  --arg message "$CHAT_PROMPT" \
  --arg session_id "$SESSION_ID" \
  --arg workflow_id "$WORKFLOW_ID" \
  '{message: $message, session_id: $session_id, workflow_id: $workflow_id}')

  curl -X POST "${CHAT_ENDPOINT}/chat/send" \
    -H "Content-Type: application/json" \
    -d "$json_payload"
expected-execution-time: "600"
output-retrieval-script: |
  PERSONA=chat
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} $PERSONA
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  kubectl delete deploy api-service -n dev-apps --ignore-not-found=true || true
  kubectl delete resourcequota dev-tight -n dev-apps --ignore-not-found=true || true
  kubectl delete ns dev-apps --ignore-not-found=true || true
