id: CHAT-AH-A-009.0
chat-prompt: |
  Ad-hoc request: disambiguate production target for payments-api across namespaces blue and green.
  Identify which namespace has the older image tag and should be prioritized for inspection first.
  Return a concise comparison with replicas and image tags for both workloads.
  If workflow metadata is injected, use workflow_id as <WORKFLOW_ID>
pre-condition-script: |
  # Pre-condition: same workload name across two namespaces with different versions.
  for ns in blue green; do
    kubectl delete ns $ns --ignore-not-found=true || true
    kubectl wait --for=delete namespace/$ns --timeout=120s || true
    kubectl create ns $ns
  done
  kubectl apply -f - <<EOF
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: payments-api
    namespace: blue
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: payments-api
    template:
      metadata:
        labels:
          app: payments-api
      spec:
        containers:
        - name: app
          image: nginx:1.26
  EOF
  kubectl apply -f - <<EOF
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: payments-api
    namespace: green
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: payments-api
    template:
      metadata:
        labels:
          app: payments-api
      spec:
        containers:
        - name: app
          image: nginx:1.27
  EOF
  kubectl rollout status deploy/payments-api -n blue --timeout=120s || true
  kubectl rollout status deploy/payments-api -n green --timeout=120s || true
execution-script: |
  export CHAT_ENDPOINT=127.0.0.1:8002
  SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")

  echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  echo CHAT_PROMPT: ${CHAT_PROMPT}
  echo SESSION_ID: ${SESSION_ID}

  json_payload=$(jq -n \
  --arg message "$CHAT_PROMPT" \
  --arg session_id "$SESSION_ID" \
  --arg workflow_id "$WORKFLOW_ID" \
  '{message: $message, session_id: $session_id, workflow_id: $workflow_id}')

  curl -X POST "${CHAT_ENDPOINT}/chat/send" \
    -H "Content-Type: application/json" \
    -d "$json_payload"
expected-execution-time: "600"
output-retrieval-script: |
  PERSONA=chat
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} $PERSONA
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  kubectl delete deploy payments-api -n blue --ignore-not-found=true || true
  kubectl delete deploy payments-api -n green --ignore-not-found=true || true
  kubectl delete ns blue green --ignore-not-found=true || true
