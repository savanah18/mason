id: CHAT-AH-012.0
chat-prompt: |
  Ad-hoc request: perform one bounded right-size change for a deployment in namespace search.
  Use kubernetes-list-workloads to pick a target, take one simple namespace-scoped resource snapshot,
  apply a minimal cpu/memory update using kubernetes-apply-resource-update,
  then send one completion event to Kafka topic tests.normal with workflow metadata if injected.
  Avoid complex metrics queries; prefer a compact snapshot and a short justification for the chosen target.
  Constraint: use up to 3 related tool calls.
  If workflow metadata is injected, use workflow_id as <WORKFLOW_ID>
pre-condition-script: |
  # Pre-condition: search namespace should exist and workloads should be available.
  kubectl get ns search || kubectl create ns search
  kubectl get deploy -n search --no-headers | wc -l
execution-script: |
  export CHAT_ENDPOINT=127.0.0.1:8002
  SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")

  echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  echo CHAT_PROMPT: ${CHAT_PROMPT}
  echo SESSION_ID: ${SESSION_ID}

  json_payload=$(jq -n \
  --arg message "$CHAT_PROMPT" \
  --arg session_id "$SESSION_ID" \
  --arg workflow_id "$WORKFLOW_ID" \
  '{message: $message, session_id: $session_id, workflow_id: $workflow_id}')

  curl -X POST "${CHAT_ENDPOINT}/chat/send" \
    -H "Content-Type: application/json" \
    -d "$json_payload"
expected-execution-time: "600"
output-retrieval-script: |
  PERSONA=chat
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} $PERSONA
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  # Cleanup intentionally omitted; scenario validates bounded mutation and eventing.
  true
