id: CHAT-AH-020.0
chat-prompt: |
  Incident resolution request: recover a quota-pressure incident in the incident-resolution namespace.
  Inspect the namespace workload and quota state, then right-size the overloaded incident-api deployment to restore headroom.
  Keep the fix minimal and explain the before/after state of the workload.
  If workflow metadata is injected, use workflow_id as <WORKFLOW_ID>
pre-condition-script: |
  # Simulate a quota pressure incident in a dedicated namespace.
  kubectl delete ns incident-resolution --ignore-not-found=true
  kubectl wait --for=delete namespace/incident-resolution --timeout=120s || true
  kubectl create ns incident-resolution
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: ResourceQuota
  metadata:
    name: incident-resolution-quota
    namespace: incident-resolution
  spec:
    hard:
      requests.cpu: "300m"
      requests.memory: "384Mi"
      limits.cpu: "500m"
      limits.memory: "512Mi"
      pods: "2"
  EOF
  kubectl apply -f - <<EOF
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: incident-api
    namespace: incident-resolution
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: incident-api
    template:
      metadata:
        labels:
          app: incident-api
      spec:
        containers:
        - name: app
          image: nginx:1.27
          resources:
            requests:
              cpu: 200m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 256Mi
  EOF
  kubectl rollout status deploy/incident-api -n incident-resolution --timeout=120s || true
execution-script: |
  export CHAT_ENDPOINT=127.0.0.1:8002
  SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")

  echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  echo CHAT_PROMPT: ${CHAT_PROMPT}
  echo SESSION_ID: ${SESSION_ID}

  json_payload=$(jq -n \
  --arg message "$CHAT_PROMPT" \
  --arg session_id "$SESSION_ID" \
  --arg workflow_id "$WORKFLOW_ID" \
  '{message: $message, session_id: $session_id, workflow_id: $workflow_id}')

  curl -X POST "${CHAT_ENDPOINT}/chat/send" \
    -H "Content-Type: application/json" \
    -d "$json_payload"
expected-execution-time: "600"
output-retrieval-script: |
  PERSONA=chat
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} $PERSONA
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  kubectl delete deploy incident-api -n incident-resolution --ignore-not-found=true || true
  kubectl delete resourcequota incident-resolution-quota -n incident-resolution --ignore-not-found=true || true
  kubectl delete ns incident-resolution --ignore-not-found=true
  kubectl wait --for=delete namespace/incident-resolution --timeout=120s || true
