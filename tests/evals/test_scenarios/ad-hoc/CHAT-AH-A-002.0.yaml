id: CHAT-AH-A-002.0
chat-prompt: |
  Ad-hoc request: analyze pod startup failures in namespace staging-monitor.
  Use pod listing and log inspection to identify the root cause (crashloop, pending, waiting).
  Suggest specific corrective actions based on the observed failure pattern.
  If workflow metadata is injected, use workflow_id as <WORKFLOW_ID>
pre-condition-script: |
  # Pre-condition: namespace with a pod in crashloop state
  kubectl delete ns staging-monitor --ignore-not-found=true || true
  kubectl wait --for=delete namespace/staging-monitor --timeout=120s || true
  kubectl create ns staging-monitor
  kubectl apply -f - <<EOF
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: monitor-agent
    namespace: staging-monitor
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: monitor-agent
    template:
      metadata:
        labels:
          app: monitor-agent
      spec:
        containers:
        - name: agent
          image: nginx:1.27
          command: ["/bin/sh"]
          args: ["-c", "exit 1"]
  EOF
  sleep 3
execution-script: |
  export CHAT_ENDPOINT=127.0.0.1:8002
  SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")

  echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  echo CHAT_PROMPT: ${CHAT_PROMPT}
  echo SESSION_ID: ${SESSION_ID}

  json_payload=$(jq -n \
  --arg message "$CHAT_PROMPT" \
  --arg session_id "$SESSION_ID" \
  --arg workflow_id "$WORKFLOW_ID" \
  '{message: $message, session_id: $session_id, workflow_id: $workflow_id}')

  curl -X POST "${CHAT_ENDPOINT}/chat/send" \
    -H "Content-Type: application/json" \
    -d "$json_payload"
expected-execution-time: "600"
output-retrieval-script: |
  PERSONA=chat
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} $PERSONA
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  kubectl delete deploy monitor-agent -n staging-monitor --ignore-not-found=true || true
  kubectl delete ns staging-monitor --ignore-not-found=true || true
