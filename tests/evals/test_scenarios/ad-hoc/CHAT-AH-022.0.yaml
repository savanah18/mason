id: CHAT-AH-022.0
chat-prompt: |
  Incident resolution request: focus on the real bottleneck in a noisy incident-resolution namespace.
  Use workload inspection and a resource snapshot to identify the overloaded deployment, then apply a bounded update only to that target.
  Ignore unrelated workload noise and explain why the selected workload was the correct remediation target.
  If workflow metadata is injected, use workflow_id as <WORKFLOW_ID>
pre-condition-script: |
  # Simulate a noisy namespace with one overloaded target deployment and one unrelated distractor.
  kubectl delete ns incident-resolution --ignore-not-found=true
  kubectl wait --for=delete namespace/incident-resolution --timeout=120s || true
  kubectl create ns incident-resolution
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: ResourceQuota
  metadata:
    name: incident-resolution-quota
    namespace: incident-resolution
  spec:
    hard:
      requests.cpu: "400m"
      requests.memory: "512Mi"
      limits.cpu: "700m"
      limits.memory: "768Mi"
      pods: "3"
  EOF
  kubectl apply -f - <<EOF
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: incident-api
    namespace: incident-resolution
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: incident-api
    template:
      metadata:
        labels:
          app: incident-api
      spec:
        containers:
        - name: app
          image: nginx:1.27
          resources:
            requests:
              cpu: 180m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 256Mi
  EOF
  kubectl apply -f - <<EOF
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: noise-batch
    namespace: incident-resolution
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: noise-batch
    template:
      metadata:
        labels:
          app: noise-batch
      spec:
        containers:
        - name: job
          image: nginx:1.27
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
  EOF
  kubectl rollout status deploy/incident-api -n incident-resolution --timeout=120s || true
  kubectl rollout status deploy/noise-batch -n incident-resolution --timeout=120s || true
execution-script: |
  export CHAT_ENDPOINT=127.0.0.1:8002
  SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")

  echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  echo CHAT_PROMPT: ${CHAT_PROMPT}
  echo SESSION_ID: ${SESSION_ID}

  json_payload=$(jq -n \
  --arg message "$CHAT_PROMPT" \
  --arg session_id "$SESSION_ID" \
  --arg workflow_id "$WORKFLOW_ID" \
  '{message: $message, session_id: $session_id, workflow_id: $workflow_id}')

  curl -X POST "${CHAT_ENDPOINT}/chat/send" \
    -H "Content-Type: application/json" \
    -d "$json_payload"
expected-execution-time: "600"
output-retrieval-script: |
  PERSONA=chat
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} $PERSONA
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  kubectl delete deploy incident-api -n incident-resolution --ignore-not-found=true || true
  kubectl delete deploy noise-batch -n incident-resolution --ignore-not-found=true || true
  kubectl delete resourcequota incident-resolution-quota -n incident-resolution --ignore-not-found=true || true
  kubectl delete ns incident-resolution --ignore-not-found=true
  kubectl wait --for=delete namespace/incident-resolution --timeout=120s || true
