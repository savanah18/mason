id: CHAT-AH-A-004.0
chat-prompt: |
  Ad-hoc request: troubleshoot a statefulset persistence issue in namespace data-services.
  Use pod status and event inspection to identify whether volumes are failing to bind, capacity is exhausted, or nodes are unavailable.
  Provide a prioritized remediation path based on root cause.
  If workflow metadata is injected, use workflow_id as <WORKFLOW_ID>
pre-condition-script: |
  # Pre-condition: namespace with statefulset and storage constraints
  kubectl delete ns data-services --ignore-not-found=true || true
  kubectl wait --for=delete namespace/data-services --timeout=120s || true
  kubectl create ns data-services
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: ResourceQuota
  metadata:
    name: data-quota
    namespace: data-services
  spec:
    hard:
      requests.storage: "100Mi"
  EOF
  kubectl apply -f - <<EOF
  apiVersion: apps/v1
  kind: StatefulSet
  metadata:
    name: data-node
    namespace: data-services
  spec:
    serviceName: data-node
    replicas: 1
    selector:
      matchLabels:
        app: data-node
    template:
      metadata:
        labels:
          app: data-node
      spec:
        containers:
        - name: node
          image: nginx:1.27
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
  EOF
  sleep 2
execution-script: |
  export CHAT_ENDPOINT=127.0.0.1:8002
  SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")

  echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  echo CHAT_PROMPT: ${CHAT_PROMPT}
  echo SESSION_ID: ${SESSION_ID}

  json_payload=$(jq -n \
  --arg message "$CHAT_PROMPT" \
  --arg session_id "$SESSION_ID" \
  --arg workflow_id "$WORKFLOW_ID" \
  '{message: $message, session_id: $session_id, workflow_id: $workflow_id}')

  curl -X POST "${CHAT_ENDPOINT}/chat/send" \
    -H "Content-Type: application/json" \
    -d "$json_payload"
expected-execution-time: "600"
output-retrieval-script: |
  PERSONA=chat
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} $PERSONA
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  kubectl delete statefulset data-node -n data-services --ignore-not-found=true || true
  kubectl delete resourcequota data-quota -n data-services --ignore-not-found=true || true
  kubectl delete ns data-services --ignore-not-found=true || true
