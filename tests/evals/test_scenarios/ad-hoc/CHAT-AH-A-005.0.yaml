id: CHAT-AH-A-005.0
chat-prompt: |
  Ad-hoc request: troubleshoot traffic failure for checkout-api in namespace traffic-debug.
  Verify whether service-to-pod selection is correct, and explain why the service has or does not have endpoints.
  Recommend the minimal remediation to restore traffic.
  If workflow metadata is injected, use workflow_id as <WORKFLOW_ID>
pre-condition-script: |
  # Pre-condition: service selector mismatch produces empty endpoints.
  kubectl delete ns traffic-debug --ignore-not-found=true || true
  kubectl wait --for=delete namespace/traffic-debug --timeout=120s || true
  kubectl create ns traffic-debug
  kubectl apply -f - <<EOF
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: checkout-api
    namespace: traffic-debug
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: checkout-api
        tier: v2
    template:
      metadata:
        labels:
          app: checkout-api
          tier: v2
      spec:
        containers:
        - name: app
          image: nginx:1.27
  EOF
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: Service
  metadata:
    name: checkout-api
    namespace: traffic-debug
  spec:
    selector:
      app: checkout-api
      tier: v1
    ports:
    - port: 80
      targetPort: 80
  EOF
  kubectl rollout status deploy/checkout-api -n traffic-debug --timeout=120s || true
execution-script: |
  export CHAT_ENDPOINT=127.0.0.1:8002
  SESSION_ID=$(curl -s -X POST ${CHAT_ENDPOINT}/session/create | jq -r ".session_id")

  echo CHAT_ENDPOINT: ${CHAT_ENDPOINT}
  echo CHAT_PROMPT: ${CHAT_PROMPT}
  echo SESSION_ID: ${SESSION_ID}

  json_payload=$(jq -n \
  --arg message "$CHAT_PROMPT" \
  --arg session_id "$SESSION_ID" \
  --arg workflow_id "$WORKFLOW_ID" \
  '{message: $message, session_id: $session_id, workflow_id: $workflow_id}')

  curl -X POST "${CHAT_ENDPOINT}/chat/send" \
    -H "Content-Type: application/json" \
    -d "$json_payload"
expected-execution-time: "600"
output-retrieval-script: |
  PERSONA=chat
  python3 tools/result_extractor.py ${WORKFLOW_ID} ${EXPECTED_EXEC_TIME_SECONDS} $PERSONA
evaluation-script:
  echo TODO evaluation script with LLM as a judge
post-condition-script: |
  kubectl delete svc checkout-api -n traffic-debug --ignore-not-found=true || true
  kubectl delete deploy checkout-api -n traffic-debug --ignore-not-found=true || true
  kubectl delete ns traffic-debug --ignore-not-found=true || true
