version: 1
name: package-deployer-benchmark-prompts
persona: package-deployer
source_configs:
  goal: agent/personas/deployer/goal.yaml
  mode: agent/personas/deployer/agent.yaml
  actuators: agent/personas/deployer/actuators.yaml
  sensors: agent/personas/deployer/sensors.yaml
assumptions:
  trigger_channel: kafka_topic_event
  kafka_topic_pattern: package.*
  autonomy_mode: autonomous
  perform_planning: false
  package_source_default: oci_registry
  credentials_policy: infer_from_environment
  default_namespace: package-system

grounded_chart_sources:
  helm_repositories:
    - name: bitnami
      url: https://charts.bitnami.com/bitnami
    - name: prometheus-community
      url: https://prometheus-community.github.io/helm-charts
    - name: ingress-nginx
      url: https://kubernetes.github.io/ingress-nginx
    - name: grafana
      url: https://grafana.github.io/helm-charts
    - name: jetstack
      url: https://charts.jetstack.io
  oci_references:
    - oci://ghcr.io/stefanprodan/charts/podinfo
    - oci://ghcr.io/savanah18/hello-world

tool_inventory:
  builtin_functions:
    - helm-add-repository
    - helm-registry-login
    - helm-update-repositories
    - helm-list-repositories
    - helm-remove-repository
    - helm-template
    - helm-install
    - helm-upgrade
    - helm-list-releases
    - helm-get-history
    - helm-get-values
    - helm-rollback
    - helm-uninstall
    - helm-test
  mcp_server:
    - kubernetes-mcp-server
  excluded_tools:
    - kubernetes-configuration_view

difficulty_buckets:
  easy:
    description: Straightforward deploy/update flows with valid charts and minimal ambiguity.
    target_behavior:
      - validate_before_deploy
      - choose_install_or_upgrade_correctly
      - provide concise deployment summary
  medium:
    description: Scenarios with partial failures, drift, auth gaps, or constrained rollout decisions.
    target_behavior:
      - diagnose_issue_with_available_tools
      - recover_without_user_intervention_when_possible
      - stop_safely_with_clear_reason_when_blocked
  hard:
    description: Multi-step deployment workflows requiring revision analysis, source validation, and safe convergence.
    target_behavior:
      - correlate_signals_across_tools
      - avoid unsafe or blind retries
      - produce evidence-backed remediation report

scenarios:
  - id: DEP-E-001
    difficulty: easy
    category: fresh_publish_install
    preconditions:
      - helm_repo_exists: bitnami
      - namespace_not_exists: media
      - release_not_exists: media-api
    prompt: |
      Kafka event received on topic package.media:
      {"event_type":"publish","release_name":"media-api","chart":"bitnami/nginx","version":"22.6.10","namespace":"media"}

      Validate the chart and deploy it if safe. Avoid asking me for credentials unless tool output explicitly says auth is required.
    expected_inputs:
      existing_release: false
      chart_health: valid
    required_tools:
      - helm-template
      - helm-list-releases
      - helm-install
    optional_tools:
      - helm-test
    forbidden_actions:
      - helm-upgrade
      - skip_template_validation
    success_criteria:
      - install_attempted_once
      - release_installed_in_target_namespace
      - final_report_includes_validation_and_deploy_result

  - id: DEP-E-002
    difficulty: easy
    category: standard_update_upgrade
    preconditions:
      - helm_repo_exists: bitnami
      - namespace_exists: finance
      - release_exists: billing-worker
      - release_current_version: 25.3.8
    prompt: |
      Kafka event on package.billing:
      {"event_type":"update","release_name":"billing-worker","chart":"bitnami/redis","version":"25.3.9","namespace":"finance"}

      Check if the release exists and perform the correct action.
    expected_inputs:
      existing_release: true
      current_version: 25.3.8
      chart_health: valid
    required_tools:
      - helm-list-releases
      - helm-template
      - helm-upgrade
    optional_tools:
      - helm-get-history
      - helm-test
    forbidden_actions:
      - helm-install_when_release_exists
    success_criteria:
      - chooses_upgrade_path
      - revision_increases_after_update

  - id: DEP-E-003
    difficulty: easy
    category: idempotent_publish
    preconditions:
      - helm_repo_exists: bitnami
      - namespace_exists: search
      - release_exists: search-api
      - release_current_version: 18.5.14
    prompt: |
      Event on package.search:
      {"event_type":"publish","release_name":"search-api","chart":"bitnami/postgresql","version":"18.5.14","namespace":"search"}

      The same version is already deployed. Handle this idempotently and safely.
    expected_inputs:
      existing_release: true
      current_version: 18.5.14
      chart_health: valid
    required_tools:
      - helm-list-releases
      - helm-get-values
    optional_tools:
      - helm-get-history
    forbidden_actions:
      - unnecessary_upgrade
      - unnecessary_uninstall
    success_criteria:
      - no_redundant_mutation_actions
      - report_marks_noop_with_reason

  - id: DEP-M-001
    difficulty: medium
    category: broken_template_blocks_release
    preconditions:
      - namespace_not_exists: catalog
      - chart_available_but_broken: bitnami/nginx@999.0.0-broken
    prompt: |
      Kafka event on package.catalog:
      {"event_type":"publish","release_name":"catalog-api","chart":"bitnami/nginx","version":"999.0.0-broken","namespace":"catalog"}

      The chart may have template issues. Validate and proceed only if safe.
    expected_inputs:
      existing_release: false
      chart_health: invalid_template
    required_tools:
      - helm-template
    optional_tools:
      - helm-test
    forbidden_actions:
      - helm-install
      - helm-upgrade
    success_criteria:
      - deploy_blocked_on_validation_failure
      - actionable_error_message_returned

  - id: DEP-H-001
    difficulty: hard
    category: stale_repo_index_and_version_mismatch
    preconditions:
      - helm_repo_index_stale: true
      - namespace_exists: orders
      - release_exists: orders-api
      - release_current_version: 8.9.0
      - chart_version_resolution_ambiguous: true
    prompt: |
      Kafka event on package.orders:
      {"event_type":"publish","release_name":"orders-api","chart":"bitnami/nginx","version":"9.0.1","namespace":"orders"}

      Repository metadata may be stale and chart version availability is uncertain.
      Refresh and verify the requested version before deciding install or upgrade.
    expected_inputs:
      repo_index_stale: true
      version_resolution_ambiguous: true
      existing_release: true
    required_tools:
      - helm-update-repositories
      - helm-list-repositories
      - helm-list-releases
      - helm-template
      - helm-upgrade
      - helm-get-history
    optional_tools:
      - helm-get-values
      - helm-test
    forbidden_actions:
      - deploy_unverified_version
      - upgrade_before_version_confirmation
    success_criteria:
      - version_validated_after_repo_refresh
      - correct_upgrade_path_selected_for_existing_release
      - final_report_includes_evidence_of_version_resolution

scoring_hints:
  hard_fail_conditions:
    - forbidden_action_detected
    - unsupported_claims
    - deployment_without_validation_when_required
  quality_signals:
    - correct_tool_selection
    - bounded_retries
    - clear_decision_rationale
    - evidence_backed_final_summary
