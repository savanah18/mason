version: '3.9'

x-serving-args: 
  HOST_SERVING_MODEL_PATH: &host_serving_model_path ${HOST_SERVING_MODEL_PATH:-./agent/serving/triton/models/qwen2.5-tensorrtllm}
  SERVICE_MODEL_PATH: &serving_model_path ${SERVICE_MODEL_PATH:-/models/qwen2.5-tensorrtllm}
  HOST_MODEL_CKPT: &host_model_ckpt ${HOST_MODEL_CKPT:-/root/workspace/lnd/aiops/vlm/Qwen/Qwen2.5-7B-Instruct}
  MODEL_CKPT: &model_ckpt ${MODEL_CKPT:-/app/tensorrt_llm/models/Qwen2.5-7B-Instruct}

x-triton-backend-env: &triton-python-backend-env
  MODEL_PATH: /root/artifacts/Qwen/Qwen2.5-7B-Instruct
  QUANTIZATION_TYPE: ${QUANTIZATION_TYPE}
  ATTENTION_IMPL: flash_attention_2
  MAX_HISTORY: 5
  MAX_NEW_TOKENS: 512
  TEMPERATURE: 0.7
  TOP_P: 0.9
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: compute,utility


x-gpu-resources: &gpu-resources
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  # FastAPI Model Server (optional - keep for backward compatibility)
  fastapi-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: triton-ai-fastapi
    ports:
      - "8000:8000"
    environment:
      - LOADING_STRATEGY=native
      - QUANTIZATION_TYPE=int4
      - ATTENTION_IMPL=sdpa
      - MODEL_PATH=/root/workspace/lnd/aiops/vlm/Qwen/Qwen3-VL-8B-Instruct
      - MAX_HISTORY=5
      - MAX_NEW_TOKENS=512
      - TEMPERATURE=0.7
      - TOP_P=0.9
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - /root/workspace/lnd/aiops/vlm:/root/workspace/lnd/aiops/vlm:ro
      - ./agent/serving:/app/agent/serving:ro
    working_dir: /app/agent/serving
    command: python model_server.py
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - triton-ai-network

  # Development TensorRT-LLM Converter Service
  # Use this instead of triton if there is no existing supported triton image for your model
  tensort-llm-server:
    image: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc0
    container_name: tensorrt-llm-server
    environment:
      <<: *common-env
    volumes:
    - source: *host_tensort_engine_path
      target: /app/tensorrt_llm/models/qwen3/1
      type: bind
    - /root/workspace/lnd/aiops/apps/newbie-app/agent/serving/optimization/tensorrt_llm:/app/tensorrt_llm/src/
    - source: *host_model_path
      target: /app/tensorrt_llm/tokenizer
      type: bind
    command: 
    - /bin/bash
    - -c 
    - /app/tensorrt_llm/src/scripts/serve.sh
    ports:
      - "8001:8000"
    gpus: all
    <<: *gpu-resources

  # Triton Inference Server
  triton-server:
    build:
      context: ./agent/serving/triton/docker
      dockerfile: Dockerfile.triton
      args:
        BUILD_MODE: ${BUILD_MODE:-prod-tensorrt-llm}  # 'dev' or 'prod-py' or 'prod-tensorrt-llm'
      additional_contexts:
        site-packages: /root/miniconda3/envs/aiops-py312/lib/python3.12/site-packages
    image: triton-ai-server:${BUILD_MODE:-prod-tensorrt-llm}
    container_name: triton-ai-server
    ports:
      - "8000:8000"   # HTTP
      - "8001:8001"   # gRPC
      - "8002:8002"   # Metrics
    environment:
      <<: *triton-python-backend-env
    volumes:
      - source: *host_serving_model_path
        target: *serving_model_path
        type: bind
      - source: *host_model_ckpt
        target: *model_ckpt
        type: bind
      #- /root/workspace/lnd/aiops/vlm/Qwen/Qwen2.5-7B-Instruct:/root/artifacts/Qwen/Qwen2.5-7B-Instruct:ro
      #- ./agent/serving/triton/models/qwen3-vl:/models/qwen3-vl:ro # comment out this when running non-python deployments/
      #- ./agent/serving/triton/models/qwen2.5-tensorrtllm:/models/qwen2.5-tensorrtllm:ro
    #command: tritonserver --model-repository=/models --log-verbose=1
    command: sleep 6000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    gpus: all
    <<: *gpu-resources
    networks:
      - triton-ai-network

  # Nginx Reverse Proxy (optional - for routing)
  nginx:
    image: nginx:latest
    container_name: triton-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./agent/serving/triton/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi-server
      - triton-server
    networks:
      - triton-ai-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: triton-ai-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - triton-ai-network

  # Redis Cache for Embeddings
  redis:
    image: redis:7-alpine
    container_name: triton-ai-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - triton-ai-network

networks:
  triton-ai-network:
    driver: bridge
