# High Level Objectives
apiVersion: agents/v1
kind: Goal
metadata:
  name: package-deployer-sensors
  labels:
    app: package-deployer-sensors
    type: autonomous
spec:
  - type: KafkaEventListener
    config_type: KafkaEventListenerConfig
    bootstrap_servers:
    - kafka-server:9092  # use localhost when running on local server
    group_id: null
    auto_offset_reset: latest
    topics:
    - package.*